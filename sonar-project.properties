sonar.host.url=https://sonarcloud.io

sonar.sources=alan
sonar.tests=tests,alan/web/src/test
sonar.test.inclusions=alan/web/src/**/*.test.ts,alan/web/src/**/*.test.tsx,alan/web/src/test/**,tests/**
sonar.exclusions=alan/web/src/api/schema.ts,alan/web/dist/**,alan/web/node_modules/**,alan/web/e2e/**,alan/web/scripts/**,alan/web/playwright.config.ts,alan/web/playwright.mobile.config.ts,alan/web/playwright.capture.config.ts,alan/web/playwright.reversed.config.ts,alan/web/playwright.desktop.config.ts,alan/web/eslint.config.js,alan/web/postcss.config.js,alan/web/vite.config.ts,alan/web/vitest.config.ts,alan/web/vitest.no-isolation.config.ts
sonar.coverage.exclusions=alan/web/e2e/**,alan/web/playwright.config.ts,alan/web/playwright.mobile.config.ts,alan/web/playwright.capture.config.ts,alan/web/playwright.reversed.config.ts,alan/web/playwright.desktop.config.ts,alan/web/vitest.config.ts,alan/web/vitest.no-isolation.config.ts,alan/web/vite.config.ts,**/*.test.ts,**/*.test.tsx,alan/web/src/test/**,alan/web/src/main.tsx,alan/web/src/vite-env.d.ts,alan/__main__.py
# `alan/teams/implementation{,_fix}.py` and `alan/teams/triage.py` share
# structural shape by design (Pattern B §"implementation_fix charter" mirrors
# the `implementation` team's shape; `triage.py` follows the same Team-protocol
# run() boilerplate — single-node dataclass + plan_workflow returning a
# PendingTaskSpec). Shared logic lives in `alan/teams/_pr_handover.py`; the
# remaining ~23-line duplication is the class declaration + plan_workflow
# signature, which is intentional Python boilerplate not real code duplication.
# Documented in docs/architecture/pr_iteration_pipeline.md.
# `alan/teams/maintenance.py` deliberately mirrors `VerificationTeam`'s
# `_collect_outputs` stage-loop shape (method signature + the `run_role`
# closure passed to `_run_stage_roles`) — that subclass-of-StaticPipelineTeam
# boilerplate is the precedent this team follows, not real duplication; the
# shared synthesis contract in `alan/teams/_static_pipeline.py` is a hard
# boundary this team must not edit, so it cannot be factored out further.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,alan/web/src/test/**,tests/**,alan/teams/implementation.py,alan/teams/implementation_fix.py,alan/teams/triage.py,alan/teams/maintenance.py

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=alan/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=alan/web/coverage/lcov.info
